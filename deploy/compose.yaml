services:
  ninfer-3090:
    build:
      context: ..
      dockerfile: Dockerfile
      pull: true
      args:
        NINFER_SOURCE_REVISION: ${NINFER_SOURCE_REVISION:?set the exact 40-hex source commit}
    image: ${NINFER_IMAGE:?set an immutable local or registry image reference}
    container_name: ninfer-3090
    labels:
      com.aifarm.service: ninfer-3090
      com.aifarm.role: service
      com.aifarm.service-revision: ${NINFER_SOURCE_REVISION:?set the exact 40-hex source commit}
      com.aifarm.model-sha256: ${NINFER_MODEL_SHA256:?set the verified artifact SHA-256}
    user: "${NINFER_UID:-1000}:${NINFER_GID:-1000}"
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=${NINFER_GPU_UUID:?set the exact GPU UUID}
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NINFER_GPU_UUID:?set the exact GPU UUID}
      CUDA_VISIBLE_DEVICES: ${NINFER_GPU_UUID:?set the exact GPU UUID}
    command:
      - /models/qwen3_8_27b.ninfer
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model-id
      - qwen3.8-27b
      - --max-context
      - "203200"
      - --kv-capacity
      - "203200"
      - --max-concurrency
      - "1"
      - --max-pending-requests
      - "16"
      - --pending-timeout-ms
      - "570000"
      - --prefill-chunk
      - "1024"
      - --log-stats-interval-ms
      - "5000"
      - --max-request-mib
      - ${NINFER_MAX_REQUEST_MIB:?set the maximum request payload in MiB}
      - --request-log-jsonl
      - /var/log/ninfer/requests.jsonl
      - --response-store-max-records
      - "1024"
      - --response-store-max-mib
      - "128"
      - --kv-dtype
      - rk8v4
      - --spec
      - mtp
      - --draft-tokens
      - "3"
      - --lm-head-draft
      - --vision
      - --vision-residency
      - overlay
      - --vision-max-merged
      - "12288"
      # Startup-fixed pinned host memory. The engine never demotes KV to host at
      # --max-concurrency 1, so this is reserve-only; the host has 62 GiB total.
      - --host-kv-mib
      - "4096"
      - --default-max-tokens
      - "16384"
    volumes:
      - type: bind
        source: ${NINFER_MODEL_PATH:?set the verified model artifact path}
        target: /models/qwen3_8_27b.ninfer
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /var/log/ninfer
        bind:
          create_host_path: false
    networks:
      discovery-net:
        aliases:
          - ninfer-3090
    ports:
      - "127.0.0.1:${NINFER_HOST_PORT:-18086}:8080"
      - "${NINFER_LAN_IP:?set the AI Farm LAN IP}:${NINFER_HOST_PORT:-18086}:8080"
      - "${NINFER_TAILSCALE_IP:?set the AI Farm Tailscale IP}:${NINFER_HOST_PORT:-18086}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 300s
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    shm_size: "1gb"
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  discovery-net:
    external: true
    name: discovery-net
